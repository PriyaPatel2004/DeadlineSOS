{% extends "base.html" %}
{% block title %}Edit task · DeadlineSOS{% endblock %}
{% block content %}
<section class="profile-layout"><div><p class="eyebrow">TASK MANAGEMENT</p><h2 class="page-title">Refine the <em>next move.</em></h2><p class="page-copy">Keep the estimate and available study time honest. They drive your risk signal and recommended order.</p></div><div class="auth-card"><p class="eyebrow">EDIT TASK</p><h2>{{ task['title'] }}</h2><form method="post" class="task-form"><label>Task name<input name="title" value="{{ task['title'] }}" required></label><div class="form-row"><label>Course<input name="course" value="{{ task['course'] }}" required></label><label>Deadline<input type="date" name="due_date" value="{{ task['due_date'] }}" required></label></div><div class="form-row"><label>Type<select name="task_type">{% for kind in ['Assignment','Exam','Project','Practical','Reading'] %}<option {% if task['task_type'] == kind %}selected{% endif %}>{{ kind }}</option>{% endfor %}</select></label><label>Hours needed<input type="number" name="estimated_hours" min="0.5" step="0.5" value="{{ task['estimated_hours'] }}" required></label></div><div class="form-row"><label>Difficulty<select name="difficulty">{% for level in range(1, 6) %}<option value="{{ level }}" {% if task['difficulty'] == level %}selected{% endif %}>{{ level }} · {% if level == 1 %}Gentle{% elif level == 2 %}Light{% elif level == 3 %}Moderate{% elif level == 4 %}Hard{% else %}Intense{% endif %}</option>{% endfor %}</select></label><label>Study hours available<input type="number" name="study_hours" min="0.5" step="0.5" value="{{ task['study_hours'] }}" required></label></div><label>Notes<textarea name="notes" rows="3">{{ task['notes'] }}</textarea></label><button class="button primary" type="submit">Save changes <span>↗</span></button></form></div></section>
{% endblock %}
